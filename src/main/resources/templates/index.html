<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>광주역 인근 문화공간</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- ✅ 카카오 지도 JS SDK: 반드시 여기, map.js보다 먼저 -->
    <script
            type="text/javascript"
            src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=여기에_JavaScript_키&libraries=services">
    </script>
</head>
<body>
<header>
    <h1>광주역 인근 문화공간</h1>
    <div class="controls">
        <input id="stationInput" placeholder="역명 입력 (예: 광주역)" value="광주역"/>
        <button id="searchBtn">검색</button>
    </div>
</header>

<main>
    <div id="map" style="width:70%; height:600px; float:left;"></div>
    <div id="list" style="width:28%; float:right; padding:10px;">
        <h3>결과</h3>
        <ul id="places"></ul>
        <div id="pagination" style="margin-top: 16px; text-align:center;"></div>
    </div>
</main>

<!-- ✅ map.js는 SDK 이후, body 제일 아래 -->
<script src="/js/map.js"></script>
</body>
</html>
